<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #000;
      --line: #353a42;
      --text: #e4e6e8;
      --hover: #1a1a1a;
      --accent: #e67e22;
      --danger: #dc3545;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --line: #d4d4d8;
      --text: #111111;
      --hover: #f4f4f5;
      --accent: #e67e22;
      --danger: #dc3545;
    }
    html, body { margin: 0; background: var(--bg); overflow: hidden; }
    body {
      font-family: 'Segoe UI', sans-serif;
      color: var(--text);
      padding: 6px;
    }
    .menu {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 10px 14px;
      font: 500 13px 'Segoe UI', sans-serif;
      cursor: pointer;
    }
    button:hover { background: var(--hover); color: var(--accent); }
    button.danger:hover { color: var(--danger); }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 4px 0;
    }
  </style>
</head>
<body>
  <div class="menu">
    <button data-act="settings">Настройки</button>
    <button data-act="show">Показать остров</button>
    <button data-act="hide">Скрыть остров</button>
    <hr />
    <button data-act="disarm">Снять охрану</button>
    <hr />
    <button class="danger" data-act="quit">Выход (нужен пароль)</button>
  </div>
  <script>
    function applyTheme(s) {
      document.documentElement.setAttribute('data-theme', s && s.theme === 'light' ? 'light' : 'dark');
    }
    document.querySelectorAll('button[data-act]').forEach((b) => {
      b.onclick = () => window.guard.tray(b.dataset.act);
    });
    window.guard.onState(applyTheme);
    window.guard.getState().then(applyTheme).catch(() => {});
  </script>
</body>
</html>
