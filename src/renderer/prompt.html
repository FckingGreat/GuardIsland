<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Guard Island</title>
  <style>
    :root {
      --bg: #000;
      --line: #353a42;
      --text: #f6f7fb;
      --muted: rgba(255,255,255,.55);
      --input-bg: rgba(0,0,0,.35);
      --input-border: rgba(255,255,255,.1);
      --no-bg: #1a1a1a;
      --accent: #e67e22;
    }
    html[data-theme="light"] {
      --bg: #ffffff;
      --line: #d4d4d8;
      --text: #111111;
      --muted: #52525b;
      --input-bg: #f4f4f5;
      --input-border: #d4d4d8;
      --no-bg: #f4f4f5;
      --accent: #e67e22;
    }
    html, body { margin: 0; height: 100%; background: transparent; }
    body {
      font: 14px/1.4 "Segoe UI", sans-serif;
      color: var(--text);
    }
    .wrap {
      height: 100%;
      padding: 22px 24px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-sizing: border-box;
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .name { color: var(--accent); word-break: break-all; font-size: 13px; margin-bottom: 8px; }
    .hint { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    input {
      width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 16px;
      border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text); font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .err { color: #dc3545; font-size: 12px; min-height: 16px; margin: 8px 0; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; height: 40px; border: 0; border-radius: 14px; cursor: pointer; font-weight: 700; }
    .ok { background: var(--accent); color: #fff; }
    .once { background: var(--no-bg); color: var(--text); border: 1px solid var(--accent); }
    .no { background: var(--no-bg); color: var(--text); border: 1px solid var(--line); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">Разрешить запуск?</h1>
    <div class="name" id="name"></div>
    <div class="hint" id="hint">Введите пароль, чтобы разрешить запуск, или нажмите «Отменить».</div>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="off" />
    <div class="err" id="err"></div>
    <div class="row" id="rememberRow">
      <button class="ok" id="remember">Внести в лист и разрешить</button>
    </div>
    <div class="row">
      <button class="once" id="ok">Разрешить</button>
      <button class="no" id="no">Отменить</button>
    </div>
  </div>
  <script>
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
    }
    function send(remember) {
      window.guard.submit(document.getElementById('pw').value, remember);
    }
    window.guard.onPrompt((d) => {
      applyTheme(d.theme);
      const quit = d.mode === 'quit';
      const has = d.hasPassword !== false;
      document.getElementById('rememberRow').classList.toggle('hidden', quit);
      document.getElementById('title').textContent = quit
        ? (has ? 'Выйти из Guard Island?' : 'Выход заблокирован')
        : 'Разрешить запуск?';
      document.getElementById('name').textContent = quit
        ? (has ? 'Тот же пароль, что на запуск программ' : 'Пароль запуска не задан')
        : ((d.name || '') + (d.path ? '\n' + d.path : ''));
      document.getElementById('hint').textContent = quit
        ? (has
          ? 'Без этого пароля приложение не завершится.'
          : 'Задайте пароль запуска в Настройки → Пароли. Пока его нет, выйти нельзя.')
        : '«Внести в лист» — больше не спрашивать это приложение и всё, что оно запускает.';
      document.getElementById('err').textContent = d.error || (!quit && d.testMode ? 'Тест: программа на паузе' : '');
      document.getElementById('pw').classList.toggle('hidden', quit && !has);
      document.getElementById('ok').textContent = quit ? (has ? 'Выйти' : 'Открыть настройки') : 'Разрешить один раз';
      document.getElementById('no').textContent = 'Отменить';
      if (!(quit && !has)) document.getElementById('pw').focus();
    });
    document.getElementById('remember').onclick = () => send(true);
    document.getElementById('ok').onclick = () => send(false);
    document.getElementById('no').onclick = () => window.guard.cancel();
    document.getElementById('pw').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send(true);
      if (e.key === 'Escape') window.guard.cancel();
    });
  </script>
</body>
</html>
