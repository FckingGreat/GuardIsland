<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    .peek {
      width: 100%; height: 100%;
      background: rgba(8,8,10,.88);
      border: 1px solid rgba(255,255,255,.12);
      border-top: 0;
      border-radius: 0 0 12px 12px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    .peek i {
      width: 28px; height: 3px;
      border-radius: 99px;
      background: #fc72ff;
      box-shadow: 0 0 10px rgba(252,114,255,.7);
    }
  </style>
</head>
<body>
  <div class="peek" id="peek"><i></i></div>
  <script>
    document.getElementById('peek').onclick = () => window.guard.showIsland();
  </script>
</body>
</html>
